version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - "9003:9003"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    command: tail -f /dev/null
